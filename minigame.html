<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooks | Baguette Mania</title>
    <style>
        :root {
            --bg-dark: #1a0008;       
            --text-main: #fff5f6;      
            --text-muted: #ffb3bb;     
            --accent-color: #e8334a; 
            --highlight-color: #ff6b7a; 
            --glass-bg: rgba(42, 16, 21, 0.85); 
            --glass-border: rgba(255, 107, 122, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Roboto, Helvetica, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            height: auto;
            overflow-y: auto; /* ALLOWS SCROLLING */
            overflow-x: hidden;
        }

        #bg {
            position: fixed; 
            inset: 0; 
            z-index: 0;
            background: url('images/tetobg.jpg') center/cover no-repeat;
            filter: blur(4px) brightness(0.4);
            transform: scale(1.05);
        }

        .ui-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        .header { text-align: center; margin-bottom: 1rem; }
        .header h1 {
            color: var(--highlight-color);
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 107, 122, 0.5);
            margin-bottom: 0.5rem;
            font-family: 'Fredoka One', sans-serif; 
        }

        .stats-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            background: var(--glass-bg);
            padding: 0.5rem 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin: 0 10px;
        }

        .stat-value { color: var(--highlight-color); display: inline-block; }

        @keyframes comboPulse {
            0% { transform: scale(1.4); color: #fff; }
            100% { transform: scale(1); color: var(--highlight-color); }
        }
        .combo-bump {
            animation: comboPulse 0.15s ease-out;
        }

        .game-container {
            position: relative;
            width: 95%; /* RESPONSIVE WIDTH */
            max-width: 450px;
            height: 65vh;
            min-height: 400px;
            background: rgba(26, 0, 8, 0.8); 
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(232, 51, 74, 0.15);
            backdrop-filter: blur(5px);
            margin: 10px auto;
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 179, 187, 0.08); 
            display: flex;
            justify-content: center;
        }
        .lane:last-child { border-right: none; }

        .judgement-indicator {
            position: absolute;
            bottom: 45px;
            width: 80%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 179, 187, 0.3); 
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            cursor: pointer;
        }

        .judgement-indicator.active {
            border-color: var(--highlight-color);
            background: rgba(232, 51, 74, 0.25);
            box-shadow: 0 0 20px var(--highlight-color);
            transform: scale(0.95) translateY(2px);
        }

        .judgement-baguette {
            font-size: 2.5rem;
            color: var(--text-muted);
            filter: grayscale(1) opacity(0.7);
            line-height: 1;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .key-text {
            position: absolute;
            bottom: -15px;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-muted);
            opacity: 0.8;
            z-index: 6;
            text-transform: uppercase;
        }

        .note {
            position: absolute;
            top: -50px;
            font-size: clamp(2rem, 8vw, 3rem); /* SCALES PROPERLY */
            will-change: transform;
            z-index: 3;
            text-shadow: 0 5px 10px rgba(0,0,0,0.5);
            animation: notePulse 0.5s infinite alternate;
        }
        @keyframes notePulse {
            from { filter: drop-shadow(0 0 5px rgba(255, 107, 122, 0.5)); }
            to { filter: drop-shadow(0 0 15px rgba(255, 107, 122, 1)) brightness(1.2); }
        }

        .judgment-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .judgment-text.show { animation: popFade 0.4s ease-out forwards; }
        @keyframes popFade {
            0% { opacity: 1; transform: translate(-50%, -20%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        .judg-perfect { color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
        .judg-great { color: #5cf68b; text-shadow: 0 0 10px #5cf68b; }
        .judg-miss { color: var(--accent-color); text-shadow: 0 0 10px var(--accent-color); }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 0, 8, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 1rem; 
        }

        .overlay h2 {
            font-size: 1.4rem; 
            margin-bottom: 0.2rem;
        }

        .hidden { display: none !important; }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem; 
            font-size: 1rem; 
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 0 #b0213a; 
        }
        .btn:hover {
            background-color: var(--highlight-color);
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(232, 51, 74, 0.4);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b0213a;
        }

        .results-stats { 
            margin: 0.5rem 0; 
            font-size: 0.95rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.3rem;
        }
        .bonus-text { 
            color: var(--highlight-color); 
            font-size: 1.2rem; 
            font-weight: 900; 
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .controls-hint {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 0 10px;
        }
        kbd {
            background: rgba(255, 179, 187, 0.15);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 179, 187, 0.3);
            color: var(--text-main);
            text-transform: uppercase;
        }

        .song-info-text {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
            letter-spacing: 1px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div class="ui-wrapper">
        <div class="header">
            <h1>Baguette Mania</h1>
            <div class="stats-spanel">
                <div>Score: <span id="scoreDisplay" class="stat-value">0</span></div>
                <div>Combo: <span id="comboDisplay" class="stat-value">0</span></div>
                <div>Acc: <span id="accDisplay" class="stat-value">100%</span></div>
            </div>
        </div>

        <div class="game-container" id="gameContainer">
            <div class="judgment-text" id="globalJudgment"></div>

            <div class="overlay hidden" id="resultScreen">
                <h2>Song Cleared!</h2>
                <div class="results-stats">
                    <div>Total Score: <span id="finalScore" class="stat-value">0</span></div>
                    <div>Max Combo: <span id="finalCombo" class="stat-value">0</span></div>
                    <div>Accuracy: <span id="finalAcc" class="stat-value">0%</span></div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">
                        Perfect: <span id="countP">0</span> | Great: <span id="countG">0</span> | Miss: <span id="countM">0</span>
                    </div>
                </div>
                <div class="bonus-text" id="bonusText">+0 Tetos Earned!</div>
                <button class="btn" onclick="returnToProfile()">Claim Tetos</button>
            </div>

            <div class="lane" id="lane0">
                <a class="judgement-indicator" id="indicator0">
                    <span class="judgement-baguette">🥖</span>
                    <span class="key-text" id="keyText0">D</span>
                </a>
            </div>
            <div class="lane" id="lane1">
                <a class="judgement-indicator" id="indicator1">
                    <span class="judgement-baguette">🥖</span>
                    <span class="key-text" id="keyText1">F</span>
                </a>
            </div>
            <div class="lane" id="lane2">
                <a class="judgement-indicator" id="indicator2">
                    <span class="judgement-baguette">🥖</span>
                    <span class="key-text" id="keyText2">J</span>
                </a>
            </div>
            <div class="lane" id="lane3">
                <a class="judgement-indicator" id="indicator3">
                    <span class="judgement-baguette">🥖</span>
                    <span class="key-text" id="keyText3">K</span>
                </a>
            </div>
        </div>

        <div class="controls-hint" id="controlsHint">Use <kbd>D</kbd>, <kbd>F</kbd>, <kbd>J</kbd>, and <kbd>K</kbd> to play. Press <kbd>R</kbd> to restart.</div>
    </div>

    <script>
        let sfxVolumeScale = 1.0;
        let FALL_DURATION = 1500; 
        
        let difficultyMode = 'normal';
        let activeKeys = ['d', 'f', 'j', 'k'];
        let resetKey = 'r';

        const HIT_WINDOW_PERFECT = 60; 
        const HIT_WINDOW_GREAT = 120; 

        try {
            const savedSettings = JSON.parse(localStorage.getItem('tetoSettings'));
            if (savedSettings) {
                sfxVolumeScale = savedSettings.sfxVolume ?? 1.0;
                
                let osuSpeed = savedSettings.baguetteSpeed ?? savedSettings.speed ?? 15;
                if (osuSpeed > 30) osuSpeed = 15; 
                FALL_DURATION = 15000 / (osuSpeed + 5); 

                difficultyMode = savedSettings.baguetteDiff ?? savedSettings.difficulty ?? 'normal';

                if(savedSettings.baguetteKeys && savedSettings.baguetteKeys.length === 4) {
                    activeKeys = savedSettings.baguetteKeys;
                } else if(savedSettings.keys && savedSettings.keys.length === 4) {
                    activeKeys = savedSettings.keys;
                }

                resetKey = savedSettings.resetKey ?? 'r';
            }
        } catch(e) {}

        document.getElementById('keyText0').innerText = activeKeys[0];
        document.getElementById('keyText1').innerText = activeKeys[1];
        document.getElementById('keyText2').innerText = activeKeys[2];
        document.getElementById('keyText3').innerText = activeKeys[3];
        document.getElementById('controlsHint').innerHTML = `Use <kbd>${activeKeys[0]}</kbd>, <kbd>${activeKeys[1]}</kbd>, <kbd>${activeKeys[2]}</kbd>, and <kbd>${activeKeys[3]}</kbd> to play. Press <kbd>${resetKey}</kbd> to restart.`;

        const sfxTap = new Audio('sounds/tap.mp3');         
        const sfxHit = new Audio('sounds/hit.mp3');         
        const sfxMiss = new Audio('sounds/miss.mp3');       
        const sfxComplete = new Audio('sounds/complete.mp3'); 

        sfxTap.volume = 0.3;
        sfxHit.volume = 0.6;
        sfxMiss.volume = 0.5;
        sfxComplete.volume = 0.8;

        function playSound(audioObj) {
            let clone = audioObj.cloneNode();
            clone.volume = audioObj.volume * sfxVolumeScale;
            clone.play().catch(e => {});
        }

        const resultScreen = document.getElementById('resultScreen');
        
        const lanes = [document.getElementById('lane0'), document.getElementById('lane1'), document.getElementById('lane2'), document.getElementById('lane3')];
        const indicators = [document.getElementById('indicator0'), document.getElementById('indicator1'), document.getElementById('indicator2'), document.getElementById('indicator3')];
        
        const globalJudgment = document.getElementById('globalJudgment');
        
        const scoreDisp = document.getElementById('scoreDisplay');
        const comboDisp = document.getElementById('comboDisplay');
        const accDisp = document.getElementById('accDisplay');
        
        let isPlaying = false;
        let isWaitingForRetry = false;
        let startTime;
        let animationFrameId;
        
        let trackHeight = 0;
        let hitY = 0;

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalHits = 0;
        let hitCounts = { perfect: 0, great: 0, miss: 0 };
        
        let chart = []; 
        let activeNotes = [];
        let nextNoteIndex = 0;

        let currentBaseBonus = 0;

        function generateChart() {
            let notes = [];
            let time = 2000; 
            let idCounter = 0;
            
            let BPM = (difficultyMode === 'hard') ? 170 : (difficultyMode === 'normal' ? 160 : 150);
            let msPerBeat = 60000 / BPM;
            let prevLane = -1;

            let totalBeats = (difficultyMode === 'hard') ? 64 : 32; 
            let subDivisions = (difficultyMode === 'hard') ? 4 : (difficultyMode === 'normal' ? 2 : 1); 

            for (let b = 0; b < totalBeats; b++) {
                for (let s = 0; s < subDivisions; s++) {
                    
                    let isJump = false;
                    if (difficultyMode === 'hard' && s === 0) isJump = true; 
                    else if (difficultyMode === 'normal' && b % 2 === 0 && s === 0) isJump = true; 

                    let l1;
                    do { l1 = Math.floor(Math.random() * 4); } while (l1 === prevLane);

                    notes.push({ 
                        id: idCounter++, 
                        time: time, 
                        lane: l1, 
                        spawnTime: time - FALL_DURATION,
                        missTime: time + HIT_WINDOW_GREAT,
                        hit: false, 
                        missed: false, 
                        el: null 
                    });
                    
                    if (isJump) {
                        let l2;
                        do { l2 = Math.floor(Math.random() * 4); } while (l2 === l1 || (subDivisions > 1 && l2 === prevLane));
                        notes.push({ 
                            id: idCounter++, 
                            time: time, 
                            lane: l2, 
                            spawnTime: time - FALL_DURATION,
                            missTime: time + HIT_WINDOW_GREAT,
                            hit: false, 
                            missed: false, 
                            el: null 
                        });
                    }
                    
                    prevLane = l1; 
                    time += msPerBeat / subDivisions;
                }
            }
            return notes;
        }

        function startGame() {
            cancelAnimationFrame(animationFrameId);
            document.querySelectorAll('.note').forEach(n => n.remove());
            
            globalJudgment.classList.remove('show', 'judg-perfect', 'judg-great', 'judg-miss');
            globalJudgment.style.color = "";
            globalJudgment.style.textShadow = "";
            
            resultScreen.classList.add('hidden');

            trackHeight = lanes[0].clientHeight;
            hitY = trackHeight - 75;

            chart = generateChart();
            activeNotes = [];
            nextNoteIndex = 0;

            score = 0; combo = 0; maxCombo = 0; totalHits = 0;
            hitCounts = { perfect: 0, great: 0, miss: 0 };
            updateStats();
            
            isPlaying = true;
            startTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(currentTime) {
            if (!isPlaying) return;

            let elapsedTime = currentTime - startTime;
            
            while(nextNoteIndex < chart.length && elapsedTime >= chart[nextNoteIndex].spawnTime) {
                let note = chart[nextNoteIndex];
                spawnNoteElement(note);
                activeNotes.push(note);
                nextNoteIndex++;
            }

            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];

                if (note.hit || note.missed) {
                    activeNotes.splice(i, 1);
                    continue;
                }

                let progress = (elapsedTime - note.spawnTime) / FALL_DURATION;
                let currentY = progress * hitY;
                note.el.style.transform = `translateY(${currentY + 26}px)`; 

                if (elapsedTime > note.missTime) {
                    registerHit('miss', note);
                    activeNotes.splice(i, 1);
                }
            }

            let lastNoteTime = chart[chart.length - 1].time;
            if (elapsedTime > lastNoteTime + 2000) {
                endGame();
                return;
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function spawnNoteElement(note) {
            let el = document.createElement('div');
            el.className = 'note';
            el.innerText = '🥖';
            
            let colors = ['#ff6b7a', '#ffb3bb', '#ffffff', '#e8334a'];
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            lanes[note.lane].appendChild(el);
            note.el = el;
            note.spawned = true;
        }

        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            let key = e.key.toLowerCase();

            if (key === resetKey) {
                if (isWaitingForRetry) return;
                playSound(sfxTap);
                isWaitingForRetry = true;
                window.parent.postMessage({ type: 'requestRetry', game: 'baguette' }, '*');
                return;
            }

            if (!isPlaying) return;

            let laneIndex = activeKeys.indexOf(key);
            
            if (laneIndex !== -1) {
                playSound(sfxTap); 
                pressKey(laneIndex);
            }
        });

        document.addEventListener('keyup', (e) => {
            let laneIndex = activeKeys.indexOf(e.key.toLowerCase());
            if (laneIndex !== -1) indicators[laneIndex].classList.remove('active');
        });

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'retryApproved') {
                isWaitingForRetry = false;
                let context = { wager: e.data.wager, concertBoost: e.data.concertBoost || 0 };
                localStorage.setItem('minigameContext', JSON.stringify(context));
                startGame();
            } else if (e.data?.type === 'retryDenied') {
                isWaitingForRetry = false;
                
                globalJudgment.classList.remove('show', 'judg-perfect', 'judg-great', 'judg-miss');
                void globalJudgment.offsetWidth; 
                globalJudgment.innerText = "NOT ENOUGH TETOS!";
                globalJudgment.style.color = "var(--accent-color)";
                globalJudgment.style.textShadow = "0 0 15px var(--accent-color)";
                globalJudgment.classList.add('show');
                
                setTimeout(() => {
                    globalJudgment.style.color = "";
                    globalJudgment.style.textShadow = "";
                }, 1500);
            }
        });

        indicators.forEach((indicator, index) => {
            indicator.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!isPlaying) return;
                playSound(sfxTap); 
                pressKey(index);
                indicator.classList.add('active');
                setTimeout(() => indicator.classList.remove('active'), 100);
            });
            indicator.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isPlaying) return;
                playSound(sfxTap); 
                pressKey(index);
                indicator.classList.add('active');
                setTimeout(() => indicator.classList.remove('active'), 100);
            });
        });

        function pressKey(laneIndex) {
            indicators[laneIndex].classList.add('active');
            let currentTime = performance.now() - startTime;
            
            let noteToHit = activeNotes.find(n => n.lane === laneIndex && !n.hit && !n.missed && n.spawned);
            
            if (noteToHit) {
                let timeDiff = Math.abs(currentTime - noteToHit.time);
                if (timeDiff <= HIT_WINDOW_PERFECT) registerHit('perfect', noteToHit);
                else if (timeDiff <= HIT_WINDOW_GREAT) registerHit('great', noteToHit);
                else if (timeDiff <= HIT_WINDOW_GREAT + 50) registerHit('miss', noteToHit);
            }
        }

        function registerHit(judgment, note) {
            note.hit = (judgment !== 'miss');
            note.missed = (judgment === 'miss');
            totalHits++;
            if (note.el) { note.el.remove(); note.el = null; }

            if (judgment === 'perfect') { 
                score += 300; combo++; hitCounts.perfect++; 
                playSound(sfxHit);
            }
            else if (judgment === 'great') { 
                score += 100; combo++; hitCounts.great++; 
                playSound(sfxHit);
            }
            else { 
                combo = 0; hitCounts.miss++; 
                playSound(sfxMiss);
            }

            if (combo > maxCombo) maxCombo = combo;
            showJudgmentText(judgment);
            updateStats();
        }

        function showJudgmentText(text) {
            globalJudgment.style.color = ""; 
            globalJudgment.style.textShadow = "";
            globalJudgment.classList.remove('show', 'judg-perfect', 'judg-great', 'judg-miss');
            void globalJudgment.offsetWidth; 
            globalJudgment.innerText = text.toUpperCase();
            globalJudgment.classList.add(`judg-${text}`, 'show');
        }

        function updateStats() {
            scoreDisp.innerText = score;
            comboDisp.innerText = combo;

            comboDisp.classList.remove('combo-bump');
            void comboDisp.offsetWidth; 
            if (combo > 0) comboDisp.classList.add('combo-bump');

            if (totalHits === 0) accDisp.innerText = "100%";
            else {
                let acc = (((hitCounts.perfect * 300) + (hitCounts.great * 100)) / (totalHits * 300)) * 100;
                accDisp.innerText = acc.toFixed(1) + "%";
            }
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            document.querySelectorAll('.note').forEach(n => n.remove());

            playSound(sfxComplete);

            let finalAccNum = parseFloat(accDisp.innerText) || 0;
            
            let context = { wager: 0, concertBoost: 0 };
            try {
                let saved = JSON.parse(localStorage.getItem('minigameContext'));
                if (saved) context = saved;
            } catch(e) {}

            let baseRatio = (difficultyMode === 'hard') ? 2.5 : 1.5;
            let maxRatio = baseRatio + (context.concertBoost || 0);
            let actualTetosEarned = Math.floor(context.wager * maxRatio * (finalAccNum / 100));

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalCombo').innerText = maxCombo;
            document.getElementById('finalAcc').innerText = accDisp.innerText;
            document.getElementById('countP').innerText = hitCounts.perfect;
            document.getElementById('countG').innerText = hitCounts.great;
            document.getElementById('countM').innerText = hitCounts.miss;
            document.getElementById('bonusText').innerText = `+${actualTetosEarned} Tetos Earned!`;

            currentBaseBonus = actualTetosEarned; 

            resultScreen.classList.remove('hidden');
        }

        function returnToProfile() {
            window.parent.postMessage({ type: 'minigameScore', score: score, tetosEarned: currentBaseBonus }, '*');
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.focus();
            document.body.focus();
            startGame();
        });
    </script>
</body>
</html>
